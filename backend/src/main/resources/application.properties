# Cassandra Configuration
cassandra.default.contact-points[0]=${CASSANDRA_DEFAULT_CONTACT_POINTS:scylladb}:${CASSANDRA_DEFAULT_PORT:9042}
cassandra.default.basic.load-balancing-policy.local-datacenter=${CASSANDRA_DEFAULT_DATACENTER:datacenter1}
cassandra.default.basic.session-keyspace=${CASSANDRA_DEFAULT_KEYSPACE:notes_maker}
cassandra.default.basic.request.timeout=10s
cassandra.default.basic.request.consistency=LOCAL_ONE
cassandra.default.advanced.connection.init-query-timeout=30s
cassandra.default.advanced.connection.set-keyspace-timeout=30s
cassandra.default.advanced.reconnection-policy.class=ExponentialReconnectionPolicy
cassandra.default.advanced.reconnection-policy.base-delay=1s
cassandra.default.advanced.reconnection-policy.max-delay=60s
cassandra.default.advanced.retry-policy.class=DefaultRetryPolicy
#cassandra.default.port=${CASSANDRA_DEFAULT_PORT:9042}
#cassandra.default.datacenter=${CASSANDRA_DEFAULT_DATACENTER:datacenter1}
#cassandra.default.local-datacenter=${CASSANDRA_DEFAULT_DATACENTER:datacenter1}
#cassandra.default.keyspace=${CASSANDRA_DEFAULT_KEYSPACE:notes_maker}
#cassandra.default.request.timeout=10s
#cassandra.default.request.consistency-level=LOCAL_ONE
#cassandra.default.connection.init-query-timeout=30s

# Health check configuration - disable Cassandra health check during startup
endpoints.health.cassandra.enabled=false

# Micronaut Configuration
micronaut.application.name=notes-maker-backend
micronaut.server.host=${MICRONAUT_SERVER_HOST:0.0.0.0}
micronaut.server.port=${MICRONAUT_SERVER_PORT:8080}
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.web.allowedOrigins[0]=http://localhost:3000
micronaut.server.cors.configurations.web.allowedOrigins[1]=http://172.105.54.21:3000
micronaut.server.cors.configurations.web.allowedOrigins[2]=http://frontend:3000
micronaut.server.cors.configurations.web.allowedMethods[0]=GET
micronaut.server.cors.configurations.web.allowedMethods[1]=POST
micronaut.server.cors.configurations.web.allowedMethods[2]=PUT
micronaut.server.cors.configurations.web.allowedMethods[3]=DELETE
micronaut.server.cors.configurations.web.allowedMethods[4]=OPTIONS
micronaut.server.cors.configurations.web.allowedHeaders[0]=*

# Logging Configuration
logging.level.com.notesmaker=${LOG_LEVEL:DEBUG}
logging.level.io.micronaut=INFO
logging.level.com.datastax.oss.driver=INFO
logging.level.root=WARN
